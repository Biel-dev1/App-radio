name: Construir Duelo de Minas

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto Android
        run: |
          test -f DueloMinas.zip
          unzip -q DueloMinas.zip -d source

      - name: Preparar assinatura persistente (opcional)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p source/app
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > source/app/release.keystore
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar APK de teste
        working-directory: source
        run: gradle assembleDebug -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}

      - name: Compilar APK de atualização assinada
        if: steps.signing.outputs.configured == 'true'
        working-directory: source
        env:
          ANDROID_STORE_FILE: release.keystore
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}

      - name: Disponibilizar APK de teste
        if: steps.signing.outputs.configured != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DueloMinas-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Disponibilizar APK assinado
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DueloMinas-APK
          path: source/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publicar atualização no GitHub Releases
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" source/app/build/outputs/apk/release/app-release.apk#DueloMinas.apk \
            --title "Duelo de Minas $RELEASE_TAG" \
            --notes "Atualização do Duelo de Minas. Instale por cima da versão existente; não é necessário desinstalar."
