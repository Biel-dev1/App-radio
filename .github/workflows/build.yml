
name: Construir Radio Amigos

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: unzip -q RadioAmigos-Android.zip -d source

      - name: Compilar APK
        working-directory: source/RadioAmigos-Android
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: RadioAmigos-APK
          path: source/RadioAmigos-Android/app/build/outputs/apk/debug/app-debug.apk
