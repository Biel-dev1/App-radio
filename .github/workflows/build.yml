
name: Construir Radio Amigos 2.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto Android
        run: |
          test -f RadioAmigos-2.0.zip
          unzip -q RadioAmigos-2.0.zip -d source

      - name: Compilar APK
        working-directory: source
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: RadioAmigos-2.0-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
